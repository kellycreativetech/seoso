# Netlify detects Next.js and applies its OpenNext adapter automatically
# (App Router, ISR revalidation and next/image all work without extra config).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Publishable Sanity values (also in .env.local). No secrets belong in this file.
  NEXT_PUBLIC_SANITY_PROJECT_ID = "cerintdw"
  NEXT_PUBLIC_SANITY_DATASET = "production"
